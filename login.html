<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostIt - Log in</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">Home</a>
      </nav>
      <a class="avatar" href="login.html">
        <img src="res/avatar.svg" width="50" height="50" alt="Your profile" />
      </a>
    </header>
    <section class="loginWrapper">
      <header>
        <h3>Welcome to PostIt</h3>
        <a href="https://www.youtube.com/watch?v=dQw4w9WgXcQ" target="_blank"
          >Create an account</a
        ><br />
        <span>or</span><br />
        <span>Please log in</span>
      </header>

      <form>
        <input type="email" placeholder="Email" id="emailInput" required />
        <p class="errorMessage" id="emailErrorMessage">
          This is not a valid email
        </p>
        <input
          type="password"
          placeholder="Password"
          id="passwordInput"
          required
        />
        <p class="errorMessage" id="pwErrorMessage">
          The password must contain 8-16 characters and no whitespace characters
        </p>

        <input
          class="submitButton"
          id="submitButton"
          type="button"
          value="Log in"
          onClick="login()"
        />
      </form>

      <a
        class="help"
        href="https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        target="_blank"
        >Forgot password</a
      >
    </section>
    <script>
      function login() {
        const email = document.getElementById("emailInput");
        const password = document.getElementById("passwordInput");

        const regex_email = new RegExp("^\\S+@\\S+\\.\\S+$", "i");
        const regex_pw = new RegExp("^\\S+$");

        if (!regex_email.test(email.value)) {
          document.getElementById("emailErrorMessage").style.visibility =
            "visible";
          email.style.color = "red";
          return;
        }
        email.style.color = "black";
        document.getElementById("emailErrorMessage").style.visibility =
          "hidden";

        if (
          !regex_pw.test(password.value) ||
          password.value.length < 8 ||
          password.value.length > 16
        ) {
          document.getElementById("pwErrorMessage").style.visibility =
            "visible";
          password.style.color = "red";
          return;
        }
        document.getElementById("pwErrorMessage").style.visibility = "hidden";
        password.style.color = "black";

        navigation.navigate("index.html");
      }
    </script>
  </body>
</html>
