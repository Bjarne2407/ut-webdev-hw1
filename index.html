<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostIt</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/index.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">Home</a>
        <span aria-hidden="true">|</span>
        <a href="addPost.html">addPost</a>
      </nav>
      <a class="avatar" href="login.html">
        <img src="res/avatar.svg" width="50" height="50" alt="Your profile" />
      </a>
    </header>
    <main>
      <aside></aside>
      <section class="feed"  id="mainFeed">
        <script>
          //const path = "db/post_db.json"
          
          const url = "https://www.jsonkeeper.com/b/VCWJX"
          fetch(url, {
              method: 'GET',
              mode: 'cors',
            }).then((response) => response.json())
            .then((data) => { 
              const posts = data["posts"]

              posts.forEach(post => {
                const authorName = post["authorName"]
                const createdAt = post["createdAt"]
                const description = post["description"]
                
                const article = document.createElement("article");
                
                const header = document.createElement("header");
                
                const profilePicture = new Image(24);
                profilePicture.src = "res/avatar.svg";
                header.appendChild(profilePicture);

                const time = document.createElement("time")
                time.dateTime = createdAt
                dateString = document.createTextNode(new Date(createdAt).toLocaleDateString('en-US', {
                  month: 'long',
                  day: '2-digit',
                  year: 'numeric'
                }));
                time.appendChild(dateString);
                header.appendChild(time)
                
                article.appendChild(header);

                console.log(post)
                if (post["containsImage"]) {
                  // decode image - "base64encodedImage"
                  const imgData = new Image();
                  let uri = post["base64encodedImage"];
                  // if (!uri.startsWith("data:image/jpeg;base64")) {
                  //   uri = "data:image/jpeg;base64," + uri
                  // }
                  
                  imgData.src = uri
                   
                  article.appendChild(imgData);
                }

                const p = document.createElement("p")
                const postDescription = document.createTextNode(description)
                p.appendChild(postDescription)
                article.appendChild(p)
                
                const button = document.createElement("button");
                const like = document.createTextNode("👍")
                button.appendChild(like)
                article.appendChild(button)

                const element = document.getElementById("mainFeed");
                element.appendChild(article);
              });
            })
        </script>
      </section>
      <aside></aside>
    </main>
    <footer>PostIt, University of Tartu 2026</footer>
  </body>
</html>
