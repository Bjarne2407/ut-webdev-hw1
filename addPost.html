<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostIt - Add Post</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/addPost.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">Home</a>
      </nav>
      <a class="avatar" href="login.html">
        <img src="res/avatar.svg" width="50" height="50" alt="Your profile" />
      </a>
    </header>
    <main>
      <section class="addPostWrapper">
        <form action="index.html">
          <label for="postDescription">Post body</label>
          <textarea
            id="postDescription"
            name="postDescription"
            required
            placeholder="Write your post description here..."
          ></textarea>
          <label for="fileChooser">Select file</label>
          <input type="file" id="fileChooser" name="fileChooser" />
          <input type="submit" value="Create post" />
        </form>
      </section>
    </main>
  </body>
</html>
