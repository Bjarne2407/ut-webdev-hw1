<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PostIt - Add Post</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/addPost.css" />
  </head>
  <body>
    <header>
      <nav>
        <a href="index.html">Home</a>
      </nav>
      <a class="avatar" href="login.html">
        <img src="res/avatar.svg" width="50" height="50" alt="Your profile" />
      </a>
    </header>
    <main>
      <section class="addPostWrapper">
        <form action="index.html" novalidate onsubmit="return createPost()">
          <label for="postBody">Post Body</label>
          <textarea
            id="postBody"
            name="postBody"
            placeholder="Write your post here..."
            required
            ></textarea>
          <p class="errorMessage" id="postBodyErrorMessage">
            Please enter a post body!
          </p>
          <label for="fileChooser">Select file</label>
          <input type="file" id="fileChooser" name="fileChooser" accept="image/*"/>
          <input type="submit" value="Create post" />
        </form>
      </section>
    </main>
    <script>
      function createPost() {
        const postBody = document.getElementById("postBody");
        const errorMessage = document.getElementById("postBodyErrorMessage");

        if (postBody.value.trim() === "") {
          errorMessage.style.display = "block";
          postBody.style.borderColor = "red";
          return false;
        }
        return true;
      }
    </script>
  </body>
</html>
